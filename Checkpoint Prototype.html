<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkpoint — Lakeside Health Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101828; --muted:#5B6472; --faint:#8892A0;
    --bg:#EEF1F6; --surface:#FFFFFF; --border:#D7DEE8; --border-soft:#E4E9F0;
    --brand:#0E3A53; --brand-2:#12566F; --brand-tint:#E4ECF1;
    --gold:#C8A24A; --gold-ink:#7A5E1E; --gold-tint:#FBF1DC;
    --high:#B3261E; --high-tint:#FBE9E7;
    --med:#8A6216; --med-tint:#FFF3D6;
    --low:#1E6B3A; --low-tint:#E3F3E8;
    --info-tint:#E7EEF5;
    --radius:10px;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans", Arial, sans-serif;
    font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .serif{ font-family:"IBM Plex Serif", Georgia, serif; }
  button, select, input{ font-family:inherit; font-size:inherit; }
  a{ color:var(--brand-2); }

  /* ---------- Header ---------- */
  header.app{
    background:var(--brand); color:#fff;
    padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand .mark{
    font-family:"IBM Plex Serif", Georgia, serif; font-weight:600; font-size:22px;
    letter-spacing:.2px;
  }
  .brand .mark .dot{ color:var(--gold); }
  .brand .sub{ font-size:12.5px; color:#C9D6DC; }
  .role-switch{ display:flex; gap:6px; background:rgba(255,255,255,.08); padding:4px; border-radius:999px; }
  .role-switch button{
    border:none; background:transparent; color:#D6E1E6; padding:8px 14px; border-radius:999px;
    cursor:pointer; font-size:13px; font-weight:600; transition:background .15s, color .15s;
    white-space:nowrap;
  }
  .role-switch button.active{ background:#fff; color:var(--brand); }
  .role-switch button:not(.active):hover{ background:rgba(255,255,255,.14); }

  /* ---------- Context strip ---------- */
  .context{
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .context .desc{ font-size:13.5px; color:var(--muted); max-width:640px; }
  .context .desc b{ color:var(--ink); }
  .stat-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .chip{
    background:var(--info-tint); border:1px solid var(--border-soft); border-radius:999px;
    padding:6px 13px; font-size:12.5px; font-weight:600; color:var(--brand); white-space:nowrap;
  }
  .chip b{ font-size:14px; }
  .chip.amber{ background:var(--gold-tint); color:var(--gold-ink); }
  .chip.red{ background:var(--high-tint); color:var(--high); }

  /* ---------- Main ---------- */
  main{ max-width:980px; margin:0 auto; padding:22px 24px 60px; }
  .view-title{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; gap:12px; flex-wrap:wrap; }
  .view-title h1{ font-family:"IBM Plex Serif", Georgia, serif; font-size:21px; font-weight:600; margin:0; }
  .view-title .legend{ font-size:12px; color:var(--faint); }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    margin-bottom:12px; box-shadow:var(--shadow); overflow:hidden;
  }

  /* ---- worklist row ---- */
  .row{
    display:flex; align-items:center; gap:14px; padding:14px 16px; cursor:pointer;
  }
  .row:hover{ background:#FAFBFC; }
  .row .pid{ width:96px; flex:0 0 auto; }
  .row .pid .id{ font-weight:600; font-size:14px; }
  .row .pid .site{ font-size:11.5px; color:var(--faint); margin-top:2px; }
  .tier{ flex:0 0 auto; width:92px; text-align:center; padding:5px 0; border-radius:999px; font-size:12px; font-weight:700; letter-spacing:.2px; }
  .tier.High{ background:var(--high-tint); color:var(--high); }
  .tier.Medium{ background:var(--med-tint); color:var(--med); }
  .tier.Low{ background:var(--low-tint); color:var(--low); }
  .tier.Unscored{ background:#EEF0F3; color:var(--muted); }
  .row .drivers{ flex:1 1 auto; min-width:0; font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .conf{ flex:0 0 auto; width:110px; font-size:11.5px; color:var(--faint); text-align:right; }
  .row .conf .bar{ height:5px; border-radius:4px; background:#E7EAEF; margin-top:4px; overflow:hidden; }
  .row .conf .bar span{ display:block; height:100%; background:var(--brand-2); border-radius:4px; }
  .status{ flex:0 0 auto; width:150px; text-align:right; font-size:12px; font-weight:600; }
  .status.needs{ color:var(--gold-ink); }
  .status.approved{ color:var(--low); }
  .status.overridden{ color:var(--brand-2); }
  .status.manual{ color:var(--high); }
  .chevron{ flex:0 0 auto; width:14px; color:var(--faint); transition:transform .15s; }
  .card.open .chevron{ transform:rotate(90deg); }

  .detail{ display:none; border-top:1px solid var(--border-soft); padding:16px 16px 18px; background:#FCFCFD; }
  .card.open .detail{ display:block; }
  .detail-grid{ display:flex; gap:20px; align-items:flex-start; }
  .detail-grid > div{ flex:1 1 0; min-width:0; }
  .detail-grid > .actions{ flex:0 0 260px; }
  @media (max-width:720px){ .detail-grid{ flex-direction:column; } .detail-grid > .actions{ flex-basis:auto; width:100%; } .row{ flex-wrap:wrap; } .row .conf{ order:5; width:auto; text-align:left; } }

  .detail h4{ margin:0 0 8px; font-size:12px; text-transform:none; color:var(--muted); font-weight:600; }
  .driver-list{ list-style:none; margin:0 0 14px; padding:0; }
  .driver-list li{ font-size:13.5px; padding:6px 0; border-bottom:1px dashed var(--border-soft); display:flex; justify-content:space-between; gap:10px; }
  .driver-list li:last-child{ border-bottom:none; }
  .driver-list .w{ color:var(--faint); font-size:11.5px; white-space:nowrap; }
  .suggest{ background:var(--info-tint); border-radius:8px; padding:10px 12px; font-size:13px; color:var(--brand); margin-bottom:4px; }

  .actions{ display:flex; flex-direction:column; gap:10px; }
  .btn{ border:none; border-radius:8px; padding:10px 14px; font-weight:600; font-size:13.5px; cursor:pointer; text-align:center; }
  .btn-approve{ background:var(--low); color:#fff; }
  .btn-approve:hover{ background:#175A30; }
  .btn-override{ background:#fff; border:1px solid var(--border); color:var(--ink); }
  .btn-override:hover{ background:#F3F5F8; }
  .btn-ghost{ background:transparent; border:1px dashed var(--border); color:var(--muted); }
  .override-panel{ display:none; margin-top:6px; border:1px solid var(--border-soft); border-radius:8px; padding:12px; background:#fff; }
  .override-panel.show{ display:block; }
  .field{ margin-bottom:10px; }
  .field label{ display:block; font-size:11.5px; color:var(--muted); margin-bottom:4px; font-weight:600; }
  .field select, .field textarea{ width:100%; border:1px solid var(--border); border-radius:6px; padding:7px 9px; background:#fff; color:var(--ink); }
  .field textarea{ resize:vertical; min-height:44px; }
  .btn-submit{ background:var(--brand); color:#fff; width:100%; }
  .btn-submit:hover{ background:var(--brand-2); }

  .audit{ margin-top:12px; padding-top:10px; border-top:1px solid var(--border-soft); font-size:12px; color:var(--muted); display:flex; gap:8px; align-items:flex-start; }
  .audit svg{ flex:0 0 auto; margin-top:1px; }
  .audit b{ color:var(--ink); }

  .banner{ display:flex; gap:10px; align-items:flex-start; background:var(--gold-tint); border:1px solid #EBD9A8; color:var(--gold-ink); border-radius:8px; padding:10px 12px; font-size:12.5px; margin-bottom:14px; }
  .banner svg{ flex:0 0 auto; margin-top:1px; }
  .banner.hc2{ background:var(--high-tint); border-color:#F0C6C1; color:var(--high); }

  /* ---- match queue ---- */
  .match-card{ padding:16px; }
  .match-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px; }
  .match-conf{ font-size:12px; font-weight:700; padding:4px 11px; border-radius:999px; }
  .match-conf.probable{ background:var(--gold-tint); color:var(--gold-ink); }
  .match-conf.low{ background:var(--high-tint); color:var(--high); }
  .match-conf.resolved{ background:var(--low-tint); color:var(--low); }
  .compare{ display:flex; gap:14px; margin-bottom:14px; flex-wrap:wrap; }
  .compare .rec{ flex:1 1 260px; }
  @media (max-width:600px){ .compare .rec{ flex-basis:100%; } }
  .rec{ border:1px solid var(--border-soft); border-radius:8px; padding:12px; }
  .rec .site{ font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--faint); font-weight:700; margin-bottom:8px; }
  .rec dl{ margin:0; font-size:13px; }
  .rec .dl-row{ display:flex; gap:10px; padding:2px 0; }
  .rec dt{ color:var(--faint); flex:0 0 62px; margin:0; }
  .rec dd{ margin:0; flex:1 1 auto; }
  .rec dd.match{ background:var(--low-tint); color:var(--low); border-radius:4px; padding:0 4px; display:inline-block; }
  .rec dd.diff{ background:var(--gold-tint); color:var(--gold-ink); border-radius:4px; padding:0 4px; display:inline-block; }
  .match-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .match-actions .btn{ flex:1 1 140px; }
  .btn-reject{ background:#fff; border:1px solid var(--border); color:var(--high); }
  .resolved-note{ font-size:12.5px; color:var(--low); background:var(--low-tint); border-radius:8px; padding:9px 12px; }

  /* ---- governance ---- */
  .gov-grid{ display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .gov-grid .stat-card{ flex:1 1 200px; }
  .stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow); }
  .stat-card .num{ font-family:"IBM Plex Serif", Georgia, serif; font-size:26px; font-weight:600; color:var(--brand); }
  .stat-card .lbl{ font-size:12px; color:var(--muted); margin-top:2px; }
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:14px; }
  .panel h3{ margin:0 0 12px; font-size:14px; font-family:"IBM Plex Serif", Georgia, serif; font-weight:600; }
  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:12.5px; }
  .bar-row .lbl{ width:64px; flex:0 0 auto; color:var(--muted); }
  .bar-row .track{ flex:1 1 auto; height:10px; background:#EEF0F3; border-radius:5px; overflow:hidden; }
  .bar-row .track span{ display:block; height:100%; border-radius:5px; }
  .bar-row .val{ width:34px; text-align:right; color:var(--muted); flex:0 0 auto; }
  .reason-row{ display:flex; justify-content:space-between; font-size:13px; padding:7px 0; border-bottom:1px dashed var(--border-soft); }
  .reason-row:last-child{ border-bottom:none; }
  .model-info{ margin:0; font-size:13px; }
  .model-info .dl-row{ display:flex; gap:14px; padding:3px 0; }
  .model-info dt{ color:var(--faint); flex:0 0 150px; margin:0; }
  .model-info dd{ margin:0; flex:1 1 auto; }
  .ack-btn{ margin-top:12px; }

  footer.app{ text-align:center; font-size:11.5px; color:var(--faint); padding:26px 24px 40px; }

  .empty{ text-align:center; padding:40px 20px; color:var(--faint); font-size:13.5px; }

  ::selection{ background:var(--gold-tint); }
</style>
</head>
<body>

<header class="app">
  <div class="brand">
    <span class="mark">Checkpoint<span class="dot">.</span></span>
    <span class="sub">Lakeside Health Network &nbsp;&middot;&nbsp; discharge &amp; readmission follow-up</span>
  </div>
  <div class="role-switch" id="roleSwitch">
    <button data-role="nurse" class="active">Follow-up nurse</button>
    <button data-role="steward">Health Records steward</button>
    <button data-role="gov">Governance committee</button>
  </div>
</header>

<div class="context" id="context"></div>

<main id="main"></main>

<footer class="app">
  Prototype for the 10Alytics Students Hackathon 2026 &middot; Focus Area 2, AI and the Future of Work &middot; illustrative data, not real patients
</footer>

<script>
/* ---------------- Icons ---------------- */
const ICON = {
  info: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16.5"/><circle cx="12" cy="7.7" r="0.4" fill="currentColor" stroke="none"/></svg>`,
  alert: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 2 20.5h20L12 3.5Z"/><line x1="12" y1="10" x2="12" y2="14.5"/><circle cx="12" cy="17.3" r="0.4" fill="currentColor" stroke="none"/></svg>`,
  check: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4,13 9.5,18.5 20,6"/></svg>`,
  chev: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9,5 16,12 9,19"/></svg>`,
};

/* ---------------- Data (illustrative) ---------------- */
let patients = [
  { id:"P-4471", site:"Lakeside General", tier:"High", conf:92,
    drivers:[["3 ED visits in the last 90 days","high"],["Heart failure diagnosis","high"],["Lives alone, no confirmed support at home","med"]],
    suggest:"Call within 2 working days plus a clinical review before discharge follow-up closes.",
    status:"needs", actioned:null },
  { id:"P-6614", site:"Lakeside General", tier:"High", conf:76,
    drivers:[["2 ED visits in the last 90 days","med"],["COPD diagnosis","high"],["Family support confirmed at discharge","low"]],
    suggest:"Call within 2 working days plus a clinical review before discharge follow-up closes.",
    status:"overridden", actioned:{ to:"Medium", reason:"Clinical judgement", note:"Family support confirmed by ward team at discharge; risk lower than score suggests.", by:"N. Owusu, RN", time:"09:44" } },
  { id:"P-3390", site:"Riverside Specialist", tier:"Medium", conf:81,
    drivers:[["First hospital admission","low"],["Type 2 diabetes, recently diagnosed","med"],["Five or more regular medications","med"]],
    suggest:"Call within 5 working days.",
    status:"needs", actioned:null },
  { id:"P-1183", site:"Riverside Specialist", tier:"Medium", conf:84,
    drivers:[["1 ED visit in the last 90 days","med"],["Lives with partner","low"],["Discharged on a new anticoagulant","med"]],
    suggest:"Call within 5 working days.",
    status:"needs", actioned:null },
  { id:"P-5108", site:"Lakeside General", tier:"Low", conf:88,
    drivers:[["No admissions in the last 12 months","low"],["Stable chronic conditions","low"],["Strong support confirmed at home","low"]],
    suggest:"Standard follow-up leaflet and open-access line.",
    status:"approved", actioned:{ by:"N. Owusu, RN", time:"08:52" } },
  { id:"P-2207", site:"Riverside Specialist", tier:"Unscored", conf:null,
    drivers:[["Discharge summary missing key lab values","flag"],["Model confidence below the review threshold","flag"]],
    suggest:"Routed to manual assessment (HC2). Set a tier based on clinical judgement below.",
    status:"manual", actioned:null, insufficient:true },
];

let matches = [
  { id:"M-1", conf:"probable", score:94,
    a:{ site:"Lakeside General", name:"J. Delgado", mrn:"LG-88213", dob:"14 Mar 1958", phone:"(587) 555-0142", addr:"12 Birch Cr, Unit 4" },
    b:{ site:"Riverside Specialist", name:"J. Delgado", mrn:"RS-40217", dob:"14 Mar 1958", phone:"(587) 555-0142", addr:"12 Birch Cr, Unit 7" },
    diffKeys:["addr"], resolved:null },
  { id:"M-2", conf:"low", score:61,
    a:{ site:"Lakeside General", name:"A. Osei", mrn:"LG-77042", dob:"02 Nov 1971", phone:"(403) 555-0199", addr:"88 Elm St" },
    b:{ site:"Riverside Specialist", name:"A. Osei-Mensah", mrn:"RS-51390", dob:"02 Nov 1971", phone:"(403) 555-0130", addr:"140 Willow Ave" },
    diffKeys:["name","phone","addr"], resolved:null },
  { id:"M-3", conf:"resolved", score:97,
    a:{ site:"Lakeside General", name:"R. Tanaka", mrn:"LG-63310", dob:"29 Jul 1949", phone:"(825) 555-0117", addr:"5 Harbour Rd" },
    b:{ site:"Riverside Specialist", name:"R. Tanaka", mrn:"RS-22984", dob:"29 Jul 1949", phone:"(825) 555-0117", addr:"5 Harbour Rd" },
    diffKeys:[], resolved:{ networkId:"NET-100482", by:"D. Fontaine, Health Records", time:"Yesterday, 15:20" } },
];

let role = "nurse";
let openCard = null;
let overridePanelOpen = null;

/* ---------------- Render ---------------- */
function esc(s){ return s; }

function renderContext(){
  const ctx = document.getElementById("context");
  if(role==="nurse"){
    const needs = patients.filter(p=>p.status==="needs").length;
    const manual = patients.filter(p=>p.status==="manual").length;
    ctx.innerHTML = `
      <div class="desc"><b>Checkpoints HC2 &amp; HC3.</b> AI scores and tiers each patient; you approve, override, or complete a manual assessment when confidence is too low to trust.</div>
      <div class="stat-row">
        <span class="chip"><b>${patients.length}</b> in worklist</span>
        <span class="chip amber"><b>${needs}</b> need review</span>
        <span class="chip red"><b>${manual}</b> need manual assessment</span>
      </div>`;
  } else if(role==="steward"){
    const open = matches.filter(m=>!m.resolved).length;
    ctx.innerHTML = `
      <div class="desc"><b>Checkpoint HC1.</b> The matching rules could not confirm these records belong to the same patient. Confirm, reject, or ask for more evidence before any record is linked.</div>
      <div class="stat-row">
        <span class="chip amber"><b>${open}</b> awaiting review</span>
        <span class="chip"><b>${matches.length - open}</b> resolved today</span>
      </div>`;
  } else {
    ctx.innerHTML = `
      <div class="desc"><b>Checkpoint HC4.</b> Monthly oversight of thresholds, overrides and model performance across both sites.</div>
      <div class="stat-row">
        <span class="chip">Model v2.3 &middot; validated 12 Sep</span>
      </div>`;
  }
}

function driverWeight(w){
  if(w==="flag") return `<span class="w" style="color:var(--high)">flag</span>`;
  if(w==="high") return `<span class="w" style="color:var(--high)">major factor</span>`;
  if(w==="med") return `<span class="w" style="color:var(--gold-ink)">contributing</span>`;
  return `<span class="w" style="color:var(--low)">protective</span>`;
}

const REASON_CODES = ["Clinical judgement","Patient circumstance not captured","Suspected data error","Family or carer input","Other (see note)"];

function statusLabel(p){
  if(p.status==="needs") return `<span class="status needs">Needs review</span>`;
  if(p.status==="approved") return `<span class="status approved">${ICON.check} Approved</span>`;
  if(p.status==="overridden") return `<span class="status overridden">Overridden \u2192 ${p.actioned.to}</span>`;
  if(p.status==="manual") return `<span class="status manual">Manual review needed</span>`;
  return "";
}

function renderWorklist(){
  const m = document.getElementById("main");
  let html = `<div class="view-title"><h1>Follow-up worklist</h1><span class="legend">Sorted by tier, highest risk first</span></div>`;
  const order = {High:0, Medium:1, Low:2, Unscored:-1};
  const sorted = [...patients].sort((a,b)=>order[a.tier]-order[b.tier]);
  sorted.forEach(p=>{
    const open = openCard===p.id;
    html += `<div class="card ${open?'open':''}" data-id="${p.id}">`;
    html += `<div class="row" onclick="toggleCard('${p.id}')">
      <div class="pid"><div class="id">${p.id}</div><div class="site">${p.site}</div></div>
      <div class="tier ${p.tier}">${p.tier}</div>
      <div class="drivers">${p.drivers.map(d=>d[0]).join(" &middot; ")}</div>
      <div class="conf">${p.conf!==null? p.conf+"% confidence" : "Below threshold"}<div class="bar"><span style="width:${p.conf||14}%"></span></div></div>
      ${statusLabel(p)}
      <div class="chevron">${ICON.chev}</div>
    </div>`;
    html += `<div class="detail">`;
    if(p.insufficient){
      html += `<div class="banner hc2">${ICON.alert} Insufficient data or low confidence \u2014 routed to manual assessment (HC2). The tool will not guess.</div>`;
    }
    html += `<div class="detail-grid"><div>
      <h4>Why this patient</h4>
      <ul class="driver-list">${p.drivers.map(d=>`<li><span>${d[0]}</span>${driverWeight(d[1])}</li>`).join("")}</ul>
      <h4>Suggested follow-up</h4>
      <div class="suggest">${p.suggest}</div>
    </div><div class="actions">`;

    if(p.status==="needs" || (p.insufficient && !p.actioned)){
      if(p.insufficient){
        html += `<div class="field"><label>Set tier manually</label>
          <select id="manualTier-${p.id}"><option>High</option><option selected>Medium</option><option>Low</option></select></div>
          <button class="btn btn-submit" onclick="manualAssess('${p.id}')">Record manual tier</button>`;
      } else {
        html += `<button class="btn btn-approve" onclick="approve('${p.id}')">${ICON.check} Approve ${p.tier} tier</button>
          <button class="btn btn-override" onclick="toggleOverride('${p.id}')">Override tier</button>
          <div class="override-panel ${overridePanelOpen===p.id?'show':''}" id="ov-${p.id}">
            <div class="field"><label>New tier</label>
              <select id="tierSel-${p.id}"><option>High</option><option>Medium</option><option>Low</option></select></div>
            <div class="field"><label>Reason code</label>
              <select id="reasonSel-${p.id}">${REASON_CODES.map(r=>`<option>${r}</option>`).join("")}</select></div>
            <div class="field"><label>Note (optional)</label><textarea id="noteTxt-${p.id}" placeholder="Add context for the governance review"></textarea></div>
            <button class="btn btn-submit" onclick="submitOverride('${p.id}')">Submit override</button>
          </div>`;
      }
    } else if(p.actioned){
      if(p.status==="approved"){
        html += `<div class="audit">${ICON.check}<span><b>Approved</b> by ${p.actioned.by} at ${p.actioned.time}. Logged for the monthly governance review.</span></div>`;
      } else if(p.status==="overridden"){
        html += `<div class="audit">${ICON.info}<span><b>Overridden</b> to ${p.actioned.to} by ${p.actioned.by} at ${p.actioned.time}. Reason: ${p.actioned.reason}${p.actioned.note? " \u2014 \u201c"+p.actioned.note+"\u201d":""}. Logged for HC4.</span></div>`;
      } else if(p.status==="manual"){
        html += `<div class="audit">${ICON.info}<span><b>Manual tier recorded:</b> ${p.actioned.to} by ${p.actioned.by} at ${p.actioned.time}.</span></div>`;
      }
    }
    html += `</div></div></div></div>`;
  });
  m.innerHTML = html;
}

function renderMatchQueue(){
  const m = document.getElementById("main");
  let html = `<div class="view-title"><h1>Identity match queue</h1><span class="legend">Probable matches only \u2014 exact matches link automatically</span></div>`;
  matches.forEach(match=>{
    html += `<div class="card match-card">`;
    html += `<div class="match-head"><div><b>${match.id}</b> &nbsp;<span style="color:var(--faint); font-size:12.5px;">match score ${match.score}%</span></div>`;
    if(match.resolved){
      html += `<span class="match-conf resolved">Resolved</span>`;
    } else if(match.conf==="probable"){
      html += `<span class="match-conf probable">Probable match \u2014 review needed</span>`;
    } else {
      html += `<span class="match-conf low">Low confidence</span>`;
    }
    html += `</div>`;
    html += `<div class="compare">`;
    [["a",match.a],["b",match.b]].forEach(([k,rec])=>{
      html += `<div class="rec"><div class="site">${rec.site}</div><dl>
        <div class="dl-row"><dt>Name</dt><dd class="${match.diffKeys.includes('name')?'diff':'match'}">${rec.name}</dd></div>
        <div class="dl-row"><dt>MRN</dt><dd>${rec.mrn}</dd></div>
        <div class="dl-row"><dt>DOB</dt><dd class="match">${rec.dob}</dd></div>
        <div class="dl-row"><dt>Phone</dt><dd class="${match.diffKeys.includes('phone')?'diff':'match'}">${rec.phone}</dd></div>
        <div class="dl-row"><dt>Address</dt><dd class="${match.diffKeys.includes('addr')?'diff':'match'}">${rec.addr}</dd></div>
      </dl></div>`;
    });
    html += `</div>`;
    if(match.resolved){
      html += `<div class="resolved-note">${ICON.check} Linked as <b>${match.resolved.networkId}</b> by ${match.resolved.by} \u2014 ${match.resolved.time}. Reversible from the audit log if needed.</div>`;
    } else {
      html += `<div class="match-actions">
        <button class="btn btn-approve" onclick="confirmMatch('${match.id}')">${ICON.check} Confirm match</button>
        <button class="btn btn-reject" onclick="rejectMatch('${match.id}')">Not the same patient</button>
        <button class="btn btn-ghost" onclick="moreInfo('${match.id}')">Request more information</button>
      </div>`;
    }
    html += `</div>`;
  });
  m.innerHTML = html;
}

function renderGovernance(){
  const m = document.getElementById("main");
  const overridden = patients.filter(p=>p.status==="overridden").length;
  const total = patients.length;
  const tierCounts = { High: patients.filter(p=>p.tier==="High").length, Medium: patients.filter(p=>p.tier==="Medium").length, Low: patients.filter(p=>p.tier==="Low").length };
  const tierVals = [tierCounts.High, tierCounts.Medium, tierCounts.Low, 1];
  const maxTier = Math.max.apply(null, tierVals);
  let html = `<div class="view-title"><h1>Governance snapshot</h1><span class="legend">Checkpoint HC4 \u2014 monthly review</span></div>`;
  html += `<div class="gov-grid">
    <div class="stat-card"><div class="num">${((overridden/total)*100).toFixed(0)}%</div><div class="lbl">Override rate, this batch</div></div>
    <div class="stat-card"><div class="num">2</div><div class="lbl">Matches awaiting HC1 review</div></div>
    <div class="stat-card"><div class="num">v2.3</div><div class="lbl">Model version live</div></div>
    <div class="stat-card"><div class="num">0</div><div class="lbl">Safety events this month</div></div>
  </div>`;
  html += `<div class="panel"><h3>Tier distribution, current worklist</h3>`;
  const colors = {High:"var(--high)", Medium:"var(--gold)", Low:"var(--low)"};
  const tierOrder = ["High","Medium","Low"];
  for(let ti=0; ti<tierOrder.length; ti++){
    const k = tierOrder[ti], v = tierCounts[k];
    html += `<div class="bar-row"><span class="lbl">${k}</span><div class="track"><span style="width:${(v/maxTier)*100}%; background:${colors[k]}"></span></div><span class="val">${v}</span></div>`;
  }
  html += `</div>`;
  html += `<div class="panel"><h3>Override reasons, last 30 days</h3>
    <div class="reason-row"><span>Clinical judgement</span><span><b>11</b></span></div>
    <div class="reason-row"><span>Patient circumstance not captured</span><span><b>6</b></span></div>
    <div class="reason-row"><span>Suspected data error</span><span><b>2</b></span></div>
    <div class="reason-row"><span>Family or carer input</span><span><b>3</b></span></div>
  </div>`;
  html += `<div class="panel"><h3>Model status</h3>
    <dl class="model-info">
      <div class="dl-row"><dt>Version</dt><dd>2.3, released 12 Sep 2026 (illustrative)</dd></div>
      <div class="dl-row"><dt>Validated by</dt><dd>Clinical informatics lead, sign-off on file</dd></div>
      <div class="dl-row"><dt>Subgroup check</dt><dd style="color:var(--low)">Within agreed fairness band across age, sex and site</dd></div>
      <div class="dl-row"><dt>Next scheduled review</dt><dd>First Monday of next month</dd></div>
    </dl>
    <button class="btn btn-override ack-btn" onclick="ackReview()" id="ackBtn">Acknowledge monthly review</button>
  </div>`;
  m.innerHTML = html;
}

function render(){
  renderContext();
  if(role==="nurse") renderWorklist();
  else if(role==="steward") renderMatchQueue();
  else renderGovernance();
}

/* ---------------- Interactions ---------------- */
function toggleCard(id){
  openCard = (openCard===id) ? null : id;
  overridePanelOpen = null;
  render();
}
function toggleOverride(id){
  overridePanelOpen = (overridePanelOpen===id) ? null : id;
  render();
  openCard = id;
}
function approve(id){
  const p = patients.find(x=>x.id===id);
  p.status = "approved";
  p.actioned = { by:"N. Owusu, RN", time: nowTime() };
  render(); openCard = id;
}
function submitOverride(id){
  const p = patients.find(x=>x.id===id);
  const to = document.getElementById(`tierSel-${id}`).value;
  const reason = document.getElementById(`reasonSel-${id}`).value;
  const note = document.getElementById(`noteTxt-${id}`).value;
  p.status = "overridden";
  p.tier = to;
  p.actioned = { to, reason, note, by:"N. Owusu, RN", time: nowTime() };
  overridePanelOpen = null;
  render(); openCard = id;
}
function manualAssess(id){
  const p = patients.find(x=>x.id===id);
  const to = document.getElementById(`manualTier-${id}`).value;
  p.status = "manual";
  p.tier = to;
  p.actioned = { to, by:"N. Owusu, RN", time: nowTime() };
  render(); openCard = id;
}
function confirmMatch(id){
  const m = matches.find(x=>x.id===id);
  m.resolved = { networkId: "NET-"+(100000+Math.floor(Math.random()*899999)), by:"D. Fontaine, Health Records", time:"Just now" };
  render();
}
function rejectMatch(id){
  const m = matches.find(x=>x.id===id);
  matches = matches.filter(x=>x.id!==id);
  render();
}
function moreInfo(id){
  alert("Request sent to the ward for more information. The case stays open in the queue.");
}
function ackReview(){
  const btn = document.getElementById("ackBtn");
  btn.textContent = "Acknowledged \u2014 logged to the governance record";
  btn.disabled = true;
  btn.style.opacity = 0.65;
}
function nowTime(){
  const d = new Date();
  return d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0");
}

document.getElementById("roleSwitch").addEventListener("click", e=>{
  const btn = e.target.closest("button[data-role]");
  if(!btn) return;
  role = btn.dataset.role;
  openCard = null; overridePanelOpen = null;
  document.querySelectorAll("#roleSwitch button").forEach(b=>b.classList.toggle("active", b===btn));
  render();
});

render();
</script>
</body>
</html>
